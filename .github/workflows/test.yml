name: Test

on:
    pull_request:
        branches:
            - main
            - dev
    workflow_dispatch:

permissions:
    contents: read

jobs:
    # -------------------------------------------------------------------------
    # Unit tests — Jest, no display required
    # -------------------------------------------------------------------------
    unit-tests:
        name: Unit Tests (Jest)
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.18.3

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "pnpm"

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run unit tests
              run: pnpm run test:unit

            - name: Upload coverage
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: unit-coverage
                  path: coverage/
                  retention-days: 7

    # -------------------------------------------------------------------------
    # E2E tests — Playwright + Electron, requires a virtual display (xvfb)
    # -------------------------------------------------------------------------
    e2e-tests:
        name: E2E Tests (Playwright, shard ${{ matrix.shard }}/2)
        runs-on: ubuntu-latest
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2]
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 10.18.3

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "pnpm"

            - name: Cache Electron binary
              uses: actions/cache@v4
              with:
                  path: ~/.cache/electron
                  key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Install Electron binary
              run: node ./node_modules/electron/install.js

            - name: Install Playwright Chromium and system dependencies
              run: pnpm exec playwright install --with-deps chromium

            - name: Install Linux display dependencies
              run: sudo apt-get install -y xvfb libgtk-3-0 libnotify-dev libnss3 libxss1 libasound2t64

            - name: Build application
              env:
                  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
                  SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
                  APPINSIGHTS_CONNECTION_STRING: ${{ secrets.APPINSIGHTS_CONNECTION_STRING }}
                  SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
                  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
                  SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
                  SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
              run: pnpm run build

            - name: Run e2e tests
              run: xvfb-run --auto-servernum pnpm run test:e2e --shard=${{ matrix.shard }}/2
              env:
                  CI: true

            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report-${{ matrix.shard }}
                  path: test-results/
                  retention-days: 7
